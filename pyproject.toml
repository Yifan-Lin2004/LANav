[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lanav-wsla"
version = "0.1.0"
description = "LANav training code for open-vocabulary object-goal navigation"
requires-python = ">=3.9,<3.10"
dependencies = [
  "attrs",
  "einops==0.8.1",
  "gym==0.23.0",
  "hydra-core==1.3.2",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "open-clip-torch==3.3.0",
  "timm==1.0.22",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ovon*", "config*", "third_party*"]

[tool.setuptools.package-data]
"config.experiments" = ["*.yaml"]
"config.tasks" = ["*.yaml"]
"third_party" = ["*-LICENSE"]
"third_party.GatedDeltaNet" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
